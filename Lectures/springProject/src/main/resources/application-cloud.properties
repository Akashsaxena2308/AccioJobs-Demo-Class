demo.banner=Hospital using Aiven MySQL
server.address=0.0.0.0
server.port=${PORT:8081}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?sslMode=VERIFY_IDENTITY
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${MYSQL_TRUSTSTORE_URL:file:/tmp/aiven-truststore.p12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${MYSQL_TRUSTSTORE_PASSWORD:changeit}
