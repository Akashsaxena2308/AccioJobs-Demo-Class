<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Desk · Student lookup</title>
  <link rel="stylesheet" href="desk.css">
  <script defer src="library-api.js"></script>
  <script defer src="desk.js"></script>
</head>
<body>
  <header><div class="bar"><strong>Library Desk</strong><nav aria-label="Library navigation"><a href="index.html" aria-current="page">Students</a><a href="books.html">Books</a><a href="shelves.html">Shelves</a></nav><span id="source"></span></div></header>
  <main>
    <section class="lookup">
      <div class="shelf" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1>Student lookup</h1>
      <p>Find a library card and its borrowing history.</p>
      <form id="lookup">
        <label for="student-id">Student ID</label>
        <div class="controls">
          <input id="student-id" name="student" inputmode="numeric" required pattern="[1-9][0-9]*" title="Enter a positive student ID" value="301">
          <button>Find student</button>
        </div>
      </form>
    </section>
    <p id="message" role="status"></p>
    <section id="record" hidden>
      <div class="member"><div><small>Library member</small><h2 id="member-name"></h2></div><div><small>Student ID</small><strong id="member-id"></strong></div><div><small>Library card</small><strong id="card"></strong></div></div>
      <h2 class="history">Borrowing history</h2>
      <p id="empty" hidden>No loans recorded for this student.</p>
      <div class="scroll" id="ledger"><table aria-label="Borrowing history"><thead><tr><th>Book</th><th>Issued</th><th>Returned</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </main>
</body></html>
